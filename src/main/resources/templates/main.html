<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>ERP | Painel</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/global.css}">
    <link rel="stylesheet" th:href="@{/css/dashboard.css}">
</head>
<body class="dashboard-layout">
<aside class="sidebar">
    <div class="sidebar-header">
        <strong>ERP</strong>
        <span>Sistema interno</span>
    </div>

    <nav class="sidebar-nav">
        <a th:href="@{/main}" class="nav-item active">Painel principal</a>
        <a th:href="@{/clientes}" class="nav-item">Clientes</a>
        <a th:href="@{/tokens}" class="nav-item">Tokens API</a>
    </nav>

    <div class="sidebar-footer">
        <form th:action="@{/logout}" method="post">
            <input type="hidden" name="_csrf" th:value="${_csrf.token}">
            <button type="submit">Sair</button>
        </form>
    </div>
</aside>

<div class="main-wrapper">
    <header class="top-header">
        <h1>Painel principal</h1>
    </header>

    <main class="content-area">
        <section class="workspace-panel">
            <span class="panel-kicker">ERP</span>
            <h2>Base limpa para o sistema</h2>
            <p>Esta tela esta pronta para receber os modulos do ERP. O cadastro de clientes ja esta disponivel no menu lateral.</p>
        </section>
    </main>
</div>
</body>
</html>
