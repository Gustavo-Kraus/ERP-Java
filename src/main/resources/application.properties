spring.application.name=Kraus_ERP
spring.security.oauth2.client.registration.google.client-id=futuro
spring.security.oauth2.client.registration.google.client-secret=futuro

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

spring.cache.type=caffeine
spring.cache.caffeine.spec=maximumSize=100,expireAfterWrite=5m
logging.level.org.springframework.cache.interceptor=TRACE

developer-mode=true

resilience4j.rate-limiter.instances.listarClientesApi.limit-for-period=2
resilience4j.rate-limiter.instances.listarClientesApi.limit-refresh-period=30s
resilience4j.rate-limiter.instances.listarClientesApi.timeout-duration=0