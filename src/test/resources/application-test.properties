spring.datasource.url=jdbc:h2:mem:erp-test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false

developer-mode=false

resilience4j.ratelimiter.instances.listarClientesApi.limit-for-period=1000
resilience4j.ratelimiter.instances.listarClientesApi.limit-refresh-period=1s
resilience4j.ratelimiter.instances.listarClientesApi.timeout-duration=0
